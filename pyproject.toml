[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banco-agil"
version = "1.0.0"
description = "Sistema de atendimento bancario com agentes de IA (Banco Agil)"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "streamlit>=1.36.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: testes que sobem subprocessos ou dependem de tempo real",
    "e2e: conversa com o modelo real (exige chave e consome cota)",
]
# O e2e real fica fora da rodada padrao: `pytest` tem de passar offline.
addopts = "-m 'not e2e'"
